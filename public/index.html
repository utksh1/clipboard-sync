<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clipboard Sync</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui; background: #0a0a0a; color: #fff; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { margin-bottom: 20px; font-size: 24px; }
        .clipboard-box { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .status { color: #888; font-size: 14px; margin-bottom: 10px; }
        .content { background: #0a0a0a; padding: 15px; border-radius: 4px; font-family: monospace; white-space: pre-wrap; word-break: break-all; }
        .empty { color: #666; font-style: italic; }
        .meta { display: flex; gap: 20px; margin-top: 10px; font-size: 12px; color: #666; }
        img { max-width: 100%; border-radius: 4px; margin-top: 10px; }
        button { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Clipboard Sync</h1>
        
        <div class="clipboard-box">
            <div class="status" id="status">Connecting...</div>
            <div class="content" id="content">
                <div class="empty">No clipboard data yet</div>
            </div>
            <div class="meta" id="meta"></div>
        </div>
        
        <button onclick="refresh()">🔄 Refresh</button>
    </div>

    <script>
        const API_URL = 'https://clipboard-sync-mocha.vercel.app';
        
        async function refresh() {
            try {
                document.getElementById('status').textContent = 'Loading...';
                const res = await fetch(`${API_URL}/api/clipboard`);
                const data = await res.json();
                
                if (!data || !data.content) {
                    document.getElementById('content').innerHTML = '<div class="empty">No clipboard data yet</div>';
                    document.getElementById('meta').innerHTML = '';
                    document.getElementById('status').textContent = 'No data';
                    return;
                }
                
                const contentEl = document.getElementById('content');
                
                if (data.type === 'text') {
                    contentEl.textContent = data.content;
                } else if (data.type === 'image' || data.type === 'file') {
                    contentEl.innerHTML = `<img src="${data.content}" alt="Clipboard content">`;
                }
                
                const time = new Date(data.timestamp).toLocaleString();
                document.getElementById('meta').innerHTML = `
                    <span>Device: ${data.deviceId}</span>
                    <span>Type: ${data.type}</span>
                    <span>Time: ${time}</span>
                `;
                
                document.getElementById('status').textContent = 'Synced';
            } catch (err) {
                document.getElementById('status').textContent = 'Error: ' + err.message;
            }
        }
        
        refresh();
        setInterval(refresh, 2000);
    </script>
</body>
</html>
