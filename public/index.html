<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clipboard Sync</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui; background: #0a0a0a; color: #fff; height: 100vh; display: flex; flex-direction: column; }
        .header { padding: 15px 20px; background: #1a1a1a; border-bottom: 1px solid #333; }
        h1 { font-size: 18px; }
        .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 70%; padding: 12px 16px; border-radius: 12px; word-wrap: break-word; }
        .message.sent { background: #2563eb; align-self: flex-end; margin-left: auto; }
        .message.received { background: #1a1a1a; align-self: flex-start; }
        .message-info { font-size: 11px; opacity: 0.7; margin-top: 4px; }
        .input-area { padding: 15px 20px; background: #1a1a1a; border-top: 1px solid #333; display: flex; gap: 10px; }
        input { flex: 1; background: #0a0a0a; border: 1px solid #333; border-radius: 20px; padding: 10px 16px; color: #fff; font-size: 14px; }
        input:focus { outline: none; border-color: #2563eb; }
        button { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-size: 14px; }
        button:hover { background: #1d4ed8; }
        .empty { text-align: center; color: #666; margin-top: 40px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📋 Clipboard Sync</h1>
    </div>
    
    <div class="messages" id="messages">
        <div class="empty">No messages yet. Send something!</div>
    </div>
    
    <div class="input-area">
        <input type="text" id="input" placeholder="Type a message..." onkeypress="if(event.key==='Enter')send()">
        <button onclick="send()">Send</button>
    </div>

    <script>
        const API_URL = 'https://clipboard-sync-mocha.vercel.app';
        const DEVICE_ID = 'web-' + Math.random().toString(36).substr(2, 9);
        let messages = [];
        let lastTimestamp = 0;
        
        async function send() {
            const input = document.getElementById('input');
            const text = input.value.trim();
            if (!text) return;
            
            try {
                await fetch(`${API_URL}/api/clipboard`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: 'text',
                        content: text,
                        deviceId: DEVICE_ID,
                        timestamp: Date.now()
                    })
                });
                
                input.value = '';
                refresh();
            } catch (err) {
                console.error(err);
            }
        }
        
        async function refresh() {
            try {
                const res = await fetch(`${API_URL}/api/clipboard`);
                const data = await res.json();
                
                if (!data || !data.content || data.timestamp === lastTimestamp) return;
                
                lastTimestamp = data.timestamp;
                messages.push(data);
                
                const container = document.getElementById('messages');
                container.innerHTML = '';
                
                messages.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = 'message ' + (msg.deviceId === DEVICE_ID ? 'sent' : 'received');
                    
                    const time = new Date(msg.timestamp).toLocaleTimeString();
                    div.innerHTML = `
                        <div>${msg.content}</div>
                        <div class="message-info">${msg.deviceId} • ${time}</div>
                    `;
                    
                    container.appendChild(div);
                });
                
                container.scrollTop = container.scrollHeight;
            } catch (err) {
                console.error(err);
            }
        }
        
        refresh();
        setInterval(refresh, 1000);
    </script>
</body>
</html>
